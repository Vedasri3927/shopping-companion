<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopping Companion</title>
<style>
  :root {
    --ink: #16181c;
    --muted: #6b7280;
    --line: #e5e7eb;
    --paper: #fafafa;
    --accent: #1f6f4a;
    --accent-soft: #e8f3ee;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.5rem; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 0 0 28px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 0.95rem; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 11px 20px; border: none; border-radius: 8px; background: var(--accent);
    color: white; font-size: 0.95rem; font-weight: 550; cursor: pointer;
  }
  button:disabled { background: #a8b5ae; cursor: default; }
  button.small { padding: 6px 12px; font-size: 0.82rem; }
  button.ghost { background: none; color: var(--muted); padding: 4px 8px; font-size: 0.82rem; }
  button.ghost:hover { color: var(--danger); }
  .star {
    background: none; color: #b8bcc4; padding: 0 6px 0 0; font-size: 1.25rem;
    line-height: 1; flex-shrink: 0;
  }
  .star.on { color: #d99a00; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; min-height: 22px; }
  .count { font-size: 0.85rem; color: var(--muted); }
  .refresh-toggle {
    font-size: 0.85rem; color: var(--muted); display: flex; align-items: center;
    gap: 6px; cursor: pointer; user-select: none;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th {
    text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-weight: 550; cursor: pointer; white-space: nowrap;
  }
  th.active { color: var(--ink); }
  th .arrow { font-size: 0.7em; margin-left: 3px; }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:hover td { background: #f5f5f4; }
  .best td { background: var(--accent-soft); }
  .prod { display: flex; align-items: center; gap: 10px; max-width: 340px; }
  .prod img {
    width: 40px; height: 40px; object-fit: contain; border-radius: 6px;
    border: 1px solid var(--line); background: white; flex-shrink: 0;
  }
  .prod-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.3;
  }
  .prod-title a { color: var(--ink); text-decoration: none; }
  .prod-title a:hover { text-decoration: underline; }
  .price { font-weight: 650; white-space: nowrap; }
  .old-price { color: var(--muted); text-decoration: line-through; font-size: 0.85em; margin-left: 6px; }
  .badge {
    display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 7px;
    border-radius: 20px; background: var(--accent); color: white; margin-left: 8px; vertical-align: middle;
  }
  .rating { white-space: nowrap; color: var(--muted); }
  .score {
    display: inline-block; min-width: 38px; text-align: center;
    font-weight: 700; padding: 4px 8px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; font-family: inherit; font-size: inherit;
  }
  .score.hi { background: #e8f3ee; color: #1f6f4a; }
  .score.mid { background: #fdf3dc; color: #8a5a00; }
  .score.lo { background: #fbe9e7; color: #b3261e; }
  .score.active-breakdown { border-color: currentColor; }

  .breakdown-bars { display: flex; flex-direction: column; gap: 7px; min-width: 240px; }
  .breakdown-bar-row { display: grid; grid-template-columns: 90px 1fr 34px; align-items: center; gap: 8px; font-size: 0.78rem; }
  .breakdown-bar-row .label { color: var(--muted); }
  .breakdown-bar-track { background: #eceef0; border-radius: 20px; height: 8px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; border-radius: 20px; }
  .breakdown-bar-fill.hi { background: #1f6f4a; }
  .breakdown-bar-fill.mid { background: #c98a00; }
  .breakdown-bar-fill.lo { background: #b3261e; }
  .breakdown-bar-row .val { text-align: right; font-weight: 600; color: var(--ink); }
  .breakdown-bar-row .val.na { color: var(--muted); font-weight: 400; font-style: italic; }
  .chart-panel-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .chart-panel-section:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .chart-panel h4 { margin: 0 0 10px; font-size: 0.82rem; font-weight: 650; color: var(--ink); }
  .verdict { font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .v-genuine-deal, .v-below-typical-price { background: #e8f3ee; color: #1f6f4a; }
  .v-fair-price { background: #eef0f2; color: #4b5563; }
  .v-above-typical-price { background: #fdf3dc; color: #8a5a00; }
  .v-inflated-discount, .v-suspiciously-low { background: #fbe9e7; color: #b3261e; }
  .v-refurbished-used { background: #fdf3dc; color: #8a5a00; }
  .v-pack-size-unclear, .v-not-comparable { background: #fdf3dc; color: #8a5a00; }
  .v-not-enough-data { background: #eef0f2; color: #6b7280; }
  .reason { font-size: 0.78rem; color: var(--muted); margin-top: 4px; max-width: 230px; line-height: 1.3; }
  .note { font-size: 0.78rem; color: var(--muted); margin-top: 14px; }
  .empty, .error, .loading { padding: 40px 10px; text-align: center; color: var(--muted); font-size: 0.92rem; }
  .error { color: var(--danger); }
  #wishlist-section { margin: 8px 0 28px; padding: 4px 16px 12px; background: white; border: 1px solid var(--line); border-radius: 10px; }
  #wishlist-section h2 { font-size: 1rem; margin: 0; }
  .target { width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 0.88rem; }
  .hit { background: #e8f3ee; color: #1f6f4a; }
  .drop { color: #1f6f4a; font-size: 0.82rem; font-weight: 600; }

  .chart-btn {
    background: var(--accent); border: 1px solid var(--accent); color: white;
    height: 24px; border-radius: 6px; cursor: pointer;
    margin-left: 6px; vertical-align: middle; padding: 0 8px;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.72rem; font-weight: 600; white-space: nowrap;
  }
  .chart-btn:hover, .chart-btn.open { background: #164f36; border-color: #164f36; }
  .chart-row td { padding: 0; border-bottom: 1px solid var(--line); }
  .chart-panel { padding: 16px 18px; background: #fbfbfa; }
  .chart-panel .loading, .chart-panel .empty { padding: 10px 0; font-size: 0.85rem; color: var(--muted); }
  .chart-svg-wrap { display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
  .chart-stats { font-size: 0.8rem; color: var(--muted); line-height: 1.6; min-width: 140px; }
  .chart-stats b { color: var(--ink); font-size: 0.92rem; }
  .chart-stats .lo { color: #1f6f4a; }
  .chart-stats .hi { color: #b3261e; }
  .hero .sub { margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 6px; font-size: 0.85rem; color: var(--muted); }
  button.chip { padding: 5px 12px; border-radius: 20px; background: white; color: var(--ink); border: 1px solid var(--line); font-size: 0.85rem; font-weight: 500; }
  button.chip:hover { border-color: var(--accent); color: var(--accent); }
  .trusted { display: inline-block; margin-left: 6px; font-size: 0.7rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 20px; white-space: nowrap; }
  #results, #wishlist { overflow-x: auto; }
  .chart-svg-wrap svg { max-width: 100%; height: auto; }
  @media (max-width: 640px) {
    .wrap { padding: 24px 12px 60px; }
    table { font-size: 0.85rem; }
    td, th { padding: 10px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Shopping Companion</h1>
  <p class="sub">Is that discount real? Shopping Companion checks every listing against real price history and gives it a Buy Score, so you can tell a genuine deal from an inflated one.</p>

  <form id="search-form">
    <input type="text" id="query" placeholder="e.g. boat airdopes 141" autocomplete="off" required />
    <button type="submit" id="search-btn">Search</button>
  </form>
  <div class="chips" id="chips"><span>Try:</span></div>

  <div class="row">
    <span class="count" id="count"></span>
    <label class="refresh-toggle">
      <input type="checkbox" id="refresh" /> Force live refresh
    </label>
  </div>

  <section id="wishlist-section" hidden>
    <div class="row">
      <h2>★ Wishlist</h2>
      <button class="small" id="check-drops" type="button">Check for price drops</button>
    </div>
    <div id="wishlist"></div>
  </section>

  <div id="results"></div>
</div>

<script>
  // Change this if your FastAPI server runs somewhere other than localhost:8000
  const API_BASE = "http://127.0.0.1:8000";

  const form = document.getElementById("search-form");
  const queryInput = document.getElementById("query");
  const refreshInput = document.getElementById("refresh");
  const searchBtn = document.getElementById("search-btn");
  const resultsEl = document.getElementById("results");
  const countEl = document.getElementById("count");
  const wishSection = document.getElementById("wishlist-section");
  const wishEl = document.getElementById("wishlist");
  const checkBtn = document.getElementById("check-drops");

  // Example searches shown under the search box. Edit this list to queries you have tested.
  const chipsEl = document.getElementById("chips");
  const EXAMPLES = ["boat airdopes 141", "hp victus", "raga by titan"];
  EXAMPLES.forEach(q => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = q;
    b.addEventListener("click", () => { queryInput.value = q; runSearch(q); });
    chipsEl.appendChild(b);
  });

  let currentResults = [];
  let wishlist = [];
  let sortChain = []; // e.g. [{key:"price", asc:true}, {key:"buy_score", asc:false}]; empty = price low to high
  const SORT_PRIORITY = ["buy_score", "rating", "price", "seller", "title"]; // first = strongest
  const DESC_FIRST = new Set(["buy_score", "rating"]); // higher is better, so first click sorts high to low

  async function api(path, opts) {
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const detail = typeof body.detail === "string" ? body.detail : "Invalid value";
      throw new Error(detail || `Request failed (${res.status})`);
    }
    return res.json();
  }
  const jsonPost = (path, data) =>
    api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    runSearch(queryInput.value.trim());
  });

  async function runSearch(q) {
    if (!q) return;
    searchBtn.disabled = true;
    searchBtn.textContent = "Searching...";
    countEl.textContent = "";
    resultsEl.innerHTML = '<div class="loading">Fetching live prices…</div>';
    try {
      const data = await api(`/search?q=${encodeURIComponent(q)}&refresh=${refreshInput.checked}`);
      currentResults = data.results || [];
      sortChain = [];
      countEl.textContent = currentResults.length
        ? `${currentResults.length} results · ${data.source === "cache" ? "cached" : "live"}`
        : "";
      render();
      loadWishlist(); // prices may have changed
    } catch (err) {
      resultsEl.innerHTML = `<div class="error">Couldn't fetch results: ${escapeHtml(err.message)}. Is the API running at ${API_BASE}?</div>`;
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = "Search";
    }
  }

  function sortResults() {
    const chain = sortChain.length ? sortChain : [{ key: "price", asc: true }];
    return [...currentResults].sort((a, b) => {
      for (const { key, asc } of chain) {
        const av = a[key], bv = b[key];
        if (av == null && bv == null) continue;
        if (av == null) return 1;   // missing values always go last
        if (bv == null) return -1;
        const c = typeof av === "string" ? av.localeCompare(bv) : av - bv;
        if (c !== 0) return asc ? c : -c;
      }
      return 0;
    });
  }

  // Click a header: add it to the sort (first click), flip its direction (second), remove it (third).
  function cycleSort(key) {
    const i = sortChain.findIndex(s => s.key === key);
    if (i === -1) sortChain.push({ key, asc: !DESC_FIRST.has(key) });
    else if (sortChain[i].asc === !DESC_FIRST.has(key)) sortChain[i].asc = !sortChain[i].asc;
    else sortChain.splice(i, 1);
    sortChain.sort((a, b) => SORT_PRIORITY.indexOf(a.key) - SORT_PRIORITY.indexOf(b.key));
    render();
  }

  function render() {
    if (!currentResults.length) {
      resultsEl.innerHTML = '<div class="empty">No results yet. Try a search above.</div>';
      return;
    }
    const sorted = sortResults();
    const lowestPrice = Math.min(...currentResults.map(r => r.price));
    const saved = new Set(wishlist.map(w => w.product_id));

    const headers = [
      { key: "title", label: "Product" },
      { key: "seller", label: "Seller" },
      { key: "price", label: "Price" },
      { key: "rating", label: "Rating" },
      { key: "buy_score", label: "Buy Score" },
      { key: "deal_verdict", label: "Deal check", nosort: true },
    ];

    const headHtml = headers.map(h => {
      const pos = sortChain.findIndex(s => s.key === h.key);
      const active = pos !== -1;
      const arrow = active ? (sortChain[pos].asc ? "▲" : "▼") + (sortChain.length > 1 ? pos + 1 : "") : "";
      if (h.nosort) return `<th style="cursor:default">${h.label}</th>`;
      return `<th data-key="${h.key}" class="${active ? "active" : ""}">${h.label}<span class="arrow">${arrow}</span></th>`;
    }).join("");

    const rowsHtml = sorted.map(r => {
      const isBest = r.price === lowestPrice;
      const oldPrice = (r.old_price && r.old_price > r.price) ? `<span class="old-price">₹${formatPrice(r.old_price)}</span>` : "";
      const rating = r.rating ? `${r.rating}★${r.reviews ? ` (${r.reviews})` : ""}` : "—";
      const thumb = r.thumbnail
        ? `<img src="${escapeAttr(r.thumbnail)}" alt="" loading="lazy" />`
        : `<div style="width:40px;height:40px;border-radius:6px;border:1px solid var(--line);flex-shrink:0"></div>`;
      const link = r.link || "#";
      const on = saved.has(r.product_id);
      const pid = escapeAttr(r.product_id);
      const star = `<button type="button" class="star ${on ? "on" : ""}" data-pid="${pid}" title="${on ? "Remove from wishlist" : "Add to wishlist"}">${on ? "★" : "☆"}</button>`;
      const scoreCell = r.buy_score == null
        ? '<span class="rating">—</span>'
        : `<button type="button" class="score ${scoreClass(r.buy_score)}" data-pid="${pid}" title="Click to see why">${r.buy_score}</button>`;
      const verdictCell = r.deal_verdict
        ? `<span class="verdict v-${slug(r.deal_verdict)}">${escapeHtml(r.deal_verdict)}</span><div class="reason">${escapeHtml(r.deal_reason || "")}</div>${r.warranty ? `<div class="reason">🛡 ${escapeHtml(r.warranty)}</div>` : ""}`
        : "—";
      const chartBtn = `<button type="button" class="chart-btn" data-pid="${pid}" title="View price history"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"></polyline><polyline points="15 6 21 6 21 12"></polyline></svg>History</button>`;
      return `
        <tr class="${isBest ? "best" : ""}">
          <td>
            <div class="prod">
              ${star}
              ${thumb}
              <div class="prod-title">
                <a href="${escapeAttr(link)}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>
              </div>
            </div>
          </td>
          <td>${escapeHtml(r.seller || "—")}${r.score_breakdown && r.score_breakdown.seller === 100 ? '<span class="trusted" title="Recognised retailer or official brand store">✓ Known seller</span>' : ""}</td>
          <td class="price">₹${formatPrice(r.price)}${oldPrice}${isBest ? '<span class="badge">Lowest</span>' : ""}${r.unit_price_label ? `<div class="reason">${escapeHtml(r.unit_price_label)}</div>` : ""}${chartBtn}</td>
          <td class="rating">${rating}</td>
          <td>${scoreCell}</td>
          <td>${verdictCell}</td>
        </tr>
        <tr class="chart-row" data-chart-for="${pid}" hidden><td colspan="6"></td></tr>`;
    }).join("");

    resultsEl.innerHTML = `
      <table>
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <p class="note">Buy Score combines price history, price vs other sellers, star rating, number of reviews, warranty (only if the listing mentions it) and seller trust. Missing data is left out, not guessed. "Typical price" is a median of similar listings and may include related models. Click a score to see why, or History for the price chart. Sorting: click several column headers to combine them. Priority is fixed: Buy Score, then Rating, then Price, then Seller (the numbers show it). Click a header again to flip it, a third time to remove it.</p>`;

    resultsEl.querySelectorAll("th[data-key]").forEach(th => {
      th.addEventListener("click", () => cycleSort(th.dataset.key));
    });
  }

  // ---------------------------------------------------------------- wishlist
  async function loadWishlist() {
    try { wishlist = (await api("/wishlist")).items; } catch (e) { wishlist = []; }
    renderWishlist();
    if (currentResults.length) render(); // refresh star states
  }

  function renderWishlist() {
    wishSection.hidden = !wishlist.length;
    if (!wishlist.length) return;
    const rows = wishlist.map(w => {
      const status = w.target_hit
        ? '<span class="verdict hit">Target reached</span>'
        : w.dropped_by > 0 ? `<span class="drop">↓ ₹${formatPrice(w.dropped_by)} since saved</span>` : "—";
      const thumb = w.thumbnail ? `<img src="${escapeAttr(w.thumbnail)}" alt="" loading="lazy" />` : "";
      const now = w.current_price == null ? "—" : `₹${formatPrice(w.current_price)}`;
      return `
        <tr>
          <td><div class="prod">${thumb}<div class="prod-title"><a href="${escapeAttr(w.link || "#")}" target="_blank" rel="noopener">${escapeHtml(w.title)}</a></div></div></td>
          <td class="price">${now}${w.seller ? `<div class="reason">${escapeHtml(w.seller)}</div>` : ""}</td>
          <td><input class="target" type="number" min="1" placeholder="₹ target" data-pid="${escapeAttr(w.product_id)}" value="${w.target_price ?? ""}" /></td>
          <td>${status}</td>
          <td><button type="button" class="ghost remove" data-pid="${escapeAttr(w.product_id)}">Remove</button></td>
        </tr>`;
    }).join("");
    wishEl.innerHTML = `
      <table>
        <thead><tr>
          <th style="cursor:default">Product</th><th style="cursor:default">Now</th>
          <th style="cursor:default">Target price</th><th style="cursor:default">Status</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="note">Prices update whenever you search or run "Check for price drops" (which re-runs your saved searches live and uses SerpApi credits).</p>`;
  }

  async function toggleStar(pid) {
    try {
      if (wishlist.some(w => w.product_id === pid)) await api(`/wishlist/${encodeURIComponent(pid)}`, { method: "DELETE" });
      else await jsonPost("/wishlist", { product_id: pid });
      await loadWishlist();
    } catch (err) { alert(err.message); }
  }

  resultsEl.addEventListener("click", (e) => {
    const star = e.target.closest(".star");
    if (star) { toggleStar(star.dataset.pid); return; }
    const chartBtn = e.target.closest(".chart-btn");
    if (chartBtn) { toggleChart(chartBtn.dataset.pid); return; }
    const scoreBtn = e.target.closest(".score");
    if (scoreBtn) { toggleChart(scoreBtn.dataset.pid); return; }
  });
  wishEl.addEventListener("click", (e) => {
    const b = e.target.closest(".remove");
    if (b) toggleStar(b.dataset.pid);
  });
  wishEl.addEventListener("change", async (e) => {
    const inp = e.target.closest(".target");
    if (!inp) return;
    try {
      await jsonPost("/wishlist", { product_id: inp.dataset.pid, target_price: inp.value === "" ? null : Number(inp.value) });
      await loadWishlist();
    } catch (err) { alert(err.message); }
  });

  checkBtn.addEventListener("click", async () => {
    const queries = [...new Set(wishlist.map(w => w.query).filter(Boolean))];
    if (!queries.length) return;
    if (!confirm(`This runs ${queries.length} live search${queries.length > 1 ? "es" : ""} and uses SerpApi credits. Continue?`)) return;
    checkBtn.disabled = true;
    try {
      for (let i = 0; i < queries.length; i++) {
        checkBtn.textContent = `Checking ${i + 1}/${queries.length}…`;
        await api(`/search?q=${encodeURIComponent(queries[i])}&refresh=true`);
      }
      await loadWishlist();
    } catch (err) { alert(err.message); }
    checkBtn.disabled = false;
    checkBtn.textContent = "Check for price drops";
  });

  // ---------------------------------------------------------- price history
  const historyCache = new Map(); // product_id -> snapshots array (or "empty")

  async function toggleChart(pid) {
    const row = resultsEl.querySelector(`tr.chart-row[data-chart-for="${cssEscape(pid)}"]`);
    if (!row) return;
    // Both the score badge and the History button for this product open the
    // same panel -- keep their pressed/open visual state in sync.
    const triggers = resultsEl.querySelectorAll(
      `.chart-btn[data-pid="${cssEscape(pid)}"], .score[data-pid="${cssEscape(pid)}"]`
    );
    if (!row.hidden) {
      row.hidden = true;
      triggers.forEach(t => t.classList.remove("open", "active-breakdown"));
      return;
    }
    row.hidden = false;
    triggers.forEach(t => t.classList.add("open", "active-breakdown"));
    const cell = row.querySelector("td");

    // "Why this score" renders instantly -- score_breakdown is already in
    // currentResults, no network call needed for this part. Skipped when
    // there's no score at all (e.g. opened via the History button on a
    // listing with too little data to be scored).
    const item = currentResults.find(r => r.product_id === pid);
    const breakdownHtml = (item && item.buy_score != null) ? renderBreakdownSection(item) : "";

    const historyHtml = historyCache.has(pid)
      ? renderHistorySection(historyCache.get(pid))
      : '<div class="loading">Loading price history…</div>';
    cell.innerHTML = `<div class="chart-panel">${breakdownHtml}${historyHtml}</div>`;

    if (historyCache.has(pid)) return;
    try {
      const data = await api(`/history/${encodeURIComponent(pid)}`);
      const snaps = data.snapshots || [];
      historyCache.set(pid, snaps);
    } catch (err) {
      historyCache.set(pid, "empty"); // a 404 just means no history yet, not an error
    }
    // Re-check the row is still open before touching the DOM -- the user
    // may have collapsed it while the fetch was in flight. The history
    // section is always the last of the (at most two) panel sections.
    if (!row.hidden) {
      const sections = cell.querySelectorAll(".chart-panel-section");
      const histSection = sections[sections.length - 1];
      if (histSection) histSection.outerHTML = renderHistorySection(historyCache.get(pid));
    }
  }

  const FACTOR_NAMES = {
    history: "Price history", spread: "vs other sellers", rating: "Star rating",
    reviews: "Review count", warranty: "Warranty", seller: "Seller trust",
  };

  function renderBreakdownSection(item) {
    const b = item.score_breakdown || {};
    const rows = Object.keys(FACTOR_NAMES).map(k => {
      const v = b[k];
      if (v == null) {
        return `<div class="breakdown-bar-row">
          <span class="label">${FACTOR_NAMES[k]}</span>
          <div class="breakdown-bar-track"></div>
          <span class="val na">n/a</span>
        </div>`;
      }
      const cls = v >= 70 ? "hi" : v >= 45 ? "mid" : "lo";
      return `<div class="breakdown-bar-row">
        <span class="label">${FACTOR_NAMES[k]}</span>
        <div class="breakdown-bar-track"><div class="breakdown-bar-fill ${cls}" style="width:${Math.max(0, Math.min(100, v))}%"></div></div>
        <span class="val">${v}</span>
      </div>`;
    }).join("");
    return `
      <div class="chart-panel-section">
        <h4>Why this score: ${item.buy_score}/100</h4>
        <div class="breakdown-bars">${rows}</div>
      </div>`;
  }

  function renderHistorySection(snaps) {
    let body;
    if (snaps === "empty" || !snaps.length) {
      body = '<div class="empty">No price history yet for this product — it builds up as it gets searched again over time.</div>';
    } else if (snaps.length === 1) {
      body = `<div class="empty">Only one price point so far (₹${formatPrice(snaps[0].price)}). Check back after this product is searched again.</div>`;
    } else {
      const prices = snaps.map(s => s.price);
      const lo = Math.min(...prices), hi = Math.max(...prices);
      const latest = prices[prices.length - 1];
      const loIdx = prices.indexOf(lo), hiIdx = prices.indexOf(hi);
      body = `
        <div class="chart-svg-wrap">
          ${buildSparkline(snaps)}
          <div class="chart-stats">
            <div>Latest: <b>₹${formatPrice(latest)}</b></div>
            <div>Lowest seen: <b class="lo">₹${formatPrice(lo)}</b> (${formatDate(snaps[loIdx].captured_at)})</div>
            <div>Highest seen: <b class="hi">₹${formatPrice(hi)}</b> (${formatDate(snaps[hiIdx].captured_at)})</div>
            <div>${snaps.length} price points recorded</div>
          </div>
        </div>`;
    }
    return `<div class="chart-panel-section"><h4>Price history</h4>${body}</div>`;
  }

  function buildSparkline(snaps) {
    const W = 420, H = 110, PAD = 28;
    const prices = snaps.map(s => s.price);
    let lo = Math.min(...prices), hi = Math.max(...prices);
    if (lo === hi) { lo -= 1; hi += 1; } // avoid a flat divide-by-zero line
    const n = snaps.length;
    const x = i => PAD + (i / (n - 1)) * (W - 2 * PAD);
    const y = p => H - PAD - ((p - lo) / (hi - lo)) * (H - 2 * PAD);
    const points = snaps.map((s, i) => `${x(i).toFixed(1)},${y(s.price).toFixed(1)}`).join(" ");
    const dots = snaps.map((s, i) =>
      `<circle cx="${x(i).toFixed(1)}" cy="${y(s.price).toFixed(1)}" r="3" fill="#1f6f4a">
         <title>₹${formatPrice(s.price)} · ${escapeAttr(s.seller || "")} · ${formatDate(s.captured_at)}</title>
       </circle>`
    ).join("");
    return `
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Price history chart">
        <line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="#e5e7eb" stroke-width="1" />
        <polyline points="${points}" fill="none" stroke="#1f6f4a" stroke-width="2" />
        ${dots}
      </svg>`;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso.replace(" ", "T") + "Z");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  }

  function cssEscape(s) {
    return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  // ---------------------------------------------------------------- helpers
  function scoreClass(n) { return n >= 70 ? "hi" : n >= 45 ? "mid" : "lo"; }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z]+/g, "-"); }
  function breakdownText(r) {
    const b = r.score_breakdown || {};
    const names = { history: "Price history", spread: "Price vs sellers", rating: "Rating", reviews: "Review count", warranty: "Warranty", seller: "Seller trust" };
    return Object.keys(names).map(k => `${names[k]}: ${b[k] == null ? "n/a" : b[k]}`).join(" · ");
  }
  function formatPrice(n) { return Math.round(Number(n)).toLocaleString("en-IN"); }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  loadWishlist();
</script>
</body>
</html>
